# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: blue

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Davis Cao personal résumé website.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: 'fRTYmQDUOyw9-vlEfG8Jp3T2GvjHRB8_mZHjBhOmcaE' # html tag.content
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    show_search: true
    # blox: floating-theme-toggler

# Site footer
footer:
  copyright:
    notice: '© {year} Dingxian Cao.' # This work is licensed under {license}
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: true
